###############################################
# DVB CMS - Docker Compose (Production)
# Usage: docker compose up -d
###############################################

version: "3.9"

services:
  # ─── Next.js Application ───────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dvb-cms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dvbcms}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-dvbcms}?schema=public
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads:/app/public/uploads
      - app_data:/app/data
    networks:
      - dvb-network
    labels:
      - "com.dvbcms.service=app"

  # ─── PostgreSQL Database ───────────────────
  db:
    image: postgres:16-alpine
    container_name: dvb-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dvbcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dvbcms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dvbcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dvb-network
    labels:
      - "com.dvbcms.service=db"

  # ─── Redis Cache ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dvb-cms-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dvb-network
    labels:
      - "com.dvbcms.service=redis"

  # ─── Nginx Reverse Proxy ───────────────────
  nginx:
    image: nginx:alpine
    container_name: dvb-cms-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/var/www/uploads:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - dvb-network
    labels:
      - "com.dvbcms.service=nginx"

  # ─── Certbot (SSL) ─────────────────────────
  certbot:
    image: certbot/certbot
    container_name: dvb-cms-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl
    networks:
      - dvb-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
  app_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  dvb-network:
    driver: bridge
