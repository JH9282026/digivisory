###############################################
# DVB CMS - Docker Compose (Development)
# Usage: docker compose -f docker-compose.dev.yml up
###############################################

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dvb-cms-app-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dvbcms}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-dvbcms}?schema=public
      - NODE_ENV=development
    volumes:
      - ./nextjs_space:/app
      - /app/node_modules
      - uploads:/app/public/uploads
    ports:
      - "3000:3000"
    networks:
      - dvb-network

  db:
    image: postgres:16-alpine
    container_name: dvb-cms-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dvbcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dvbcms}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dvbcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dvb-network

volumes:
  postgres_data_dev:
  uploads:

networks:
  dvb-network:
    driver: bridge
